<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="vb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="#131B2E" stroke="#2E3A52" stroke-width="2"/>
  <g filter="url(#glow)">
    <circle cx="60" cy="60" r="38" stroke="url(#vb-grad)" stroke-width="3" stroke-opacity="0.3" fill="none"/>
    <rect x="36" y="48" width="6" height="24" rx="3" fill="url(#vb-grad)"/>
    <rect x="48" y="38" width="6" height="44" rx="3" fill="url(#vb-grad)"/>
    <rect x="60" y="28" width="6" height="64" rx="3" fill="url(#vb-grad)"/>
    <rect x="72" y="42" width="6" height="36" rx="3" fill="url(#vb-grad)"/>
    <rect x="84" y="52" width="6" height="16" rx="3" fill="url(#vb-grad)"/>
  </g>
</svg>
